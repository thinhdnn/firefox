name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "mach package target (browser by default)"
        required: false
        default: "browser"

jobs:
  build-dmg:
    name: Build Firefox DMG
    runs-on: macos-15
    timeout-minutes: 360
    env:
      MOZ_AUTOMATION: 1
      MOZ_NBUILD: 1
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: pip

      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

      # IMPORTANT: keep main build on Apple toolchain
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++

    steps:
      - name: Checkout (fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: esr140

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install WASI sysroot + LLVM for wasm only
        run: |
          brew install llvm wasi-libc wasi-runtimes
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          # sanity: Apple clang is used for main build
          /usr/bin/clang --version

      - name: Write .mozconfig
        run: |
          LLVM_BIN="$(brew --prefix llvm)/bin"
          WASI_SYSROOT="$(brew --prefix wasi-libc)/share/wasi-sysroot"
          if [ ! -d "$WASI_SYSROOT" ]; then
            WASI_SYSROOT="$(brew --prefix wasi-libc)/share"
          fi

          cat <<EOF > .mozconfig
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-esr-unbranded

          ac_add_options --enable-application=browser
          ac_add_options --disable-official-branding
          ac_add_options --with-branding=browser/branding/unofficial
          ac_add_options --disable-tests

          # Use Homebrew LLVM ONLY for wasm32-wasi
          export WASM_CC="$LLVM_BIN/clang"
          export WASM_CXX="$LLVM_BIN/clang++"
          ac_add_options --with-wasi-sysroot=$WASI_SYSROOT
          EOF

          echo "----- .mozconfig -----"
          cat .mozconfig

      - name: Bootstrap build dependencies
        run: |
          python3 --version
          ./mach bootstrap --application-choice=${{ github.event.inputs.build-type || 'browser' }}

      - name: Install cbindgen (required)
        run: |
          cargo install cbindgen --locked
          cbindgen --version

      - name: Build Firefox
        run: ./mach build

      - name: Package DMG
        run: ./mach package

      - name: Determine objdir
        run: |
          OBJDIR=$(./mach environment --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["topobjdir"])')
          echo "OBJDIR=$OBJDIR" >> $GITHUB_ENV

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-macos-dmg
          path: ${{ env.OBJDIR }}/dist/*.dmg
          if-no-files-found: error
