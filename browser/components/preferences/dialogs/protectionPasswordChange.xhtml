<?csp default-src chrome:; style-src chrome: 'unsafe-inline'; ?>

<window
  type="child"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="Change Protection Password"
  data-l10n-id="protection-password-change-window"
  data-l10n-attrs="title"
>
  <dialog
    id="ProtectionPasswordChangeDialog"
    buttons="accept,cancel"
    buttonlabelaccept="Change Password"
    data-l10n-id="protection-password-change-dialog"
    data-l10n-attrs="buttonlabelaccept"
  >
    <linkset>
      <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
      <html:link
        rel="stylesheet"
        href="chrome://browser/skin/preferences/preferences.css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://global/skin/in-content/common.css"
      />
      <html:link rel="localization" href="branding/brand.ftl" />
      <html:link
        rel="localization"
        href="browser/preferences/preferences.ftl"
      />
    </linkset>

    <vbox class="contentPane" flex="1">
      <vbox class="indent">
        <label
          control="currentPassword"
          data-l10n-id="protection-password-current-password"
        />
        <html:input id="currentPassword" type="password" />

        <label
          control="newPassword"
          style="margin-top: 10px"
          data-l10n-id="protection-password-new-password"
        />
        <html:input id="newPassword" type="password" />

        <label
          control="confirmPassword"
          style="margin-top: 10px"
          data-l10n-id="protection-password-confirm-new-password"
        />
        <html:input id="confirmPassword" type="password" />

        <description id="status" style="color: #b00020; min-height: 1.2em" />
      </vbox>
    </vbox>

    <script src="chrome://browser/content/preferences/dialogs/protectionPasswordChange.js" />
  </dialog>
</window>
