<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; img-src chrome: data:; style-src chrome: 'unsafe-inline'; script-src chrome:;"
    />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/browser.ftl" />
    <title data-l10n-id="protection-password-lock-page-title"></title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 24px;
        font: message-box;
        color: #111;
        background: transparent;
      }

      #panel {
        min-width: 360px;
        max-width: 460px;
        padding: 24px;
        background: #fff;
        border: 1px solid #222;
        border-radius: 8px;
      }

      #header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      #icon {
        width: 28px;
        height: 28px;
        flex: none;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }

      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid #444;
        border-radius: 6px;
      }

      #status {
        margin-top: 10px;
        min-height: 1.2em;
        font-size: 12px;
        color: #b00020;
      }

      #status[data-kind="info"] {
        color: #111;
      }
    </style>
  </head>
  <body>
    <div
      id="panel"
      role="dialog"
      aria-modal="true"
      data-l10n-id="protection-password-lock-panel"
      data-l10n-attrs="aria-label"
    >
      <div id="header">
        <svg
          id="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          aria-hidden="true"
        >
          <path
            d="m12 7 0-3c0-2.206-1.794-4-4-4S4 1.794 4 4l0 3a2 2 0 0 0-2 2l0 5a2 2 0 0 0 2 2l8 0a2 2 0 0 0 2-2l0-5a2 2 0 0 0-2-2zM5.25 4c0-1.517 1.233-2.75 2.75-2.75S10.75 2.483 10.75 4l0 3-5.5 0 0-3zm7.5 10.15-.6.6-8.3 0-.6-.6 0-5.3.6-.6 8.3 0 .6.6 0 5.3z"
          />
        </svg>
        <h1 data-l10n-id="protection-password-lock-heading"></h1>
      </div>

      <form id="form" autocomplete="off">
        <label
          for="password"
          data-l10n-id="protection-password-lock-password-label"
        ></label>
        <input id="password" type="password" autocomplete="off" autofocus />
        <div id="status" aria-live="polite"></div>
      </form>
    </div>

    <script src="chrome://browser/content/protectionPasswordLock.js"></script>
  </body>
</html>
